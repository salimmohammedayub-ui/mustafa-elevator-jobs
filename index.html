<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document Portal | User & Staff Exchange</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --border: #e2e8f0;
      --danger: #ef4444;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card);
      padding: 15px 20px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 20px;
    }
    .auth-box {
      max-width: 400px;
      margin: 60px auto;
      background: var(--card);
      padding: 25px;
      border-radius: 8px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }
    .auth-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .auth-tab {
      padding: 8px 16px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      font-weight: 600;
    }
    .auth-tab.active {
      border-color: var(--primary);
      color: var(--primary);
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media (max-width: 768px) {
      .grid { grid-template-columns: 1fr; }
    }
    .card {
      background: var(--card);
      padding: 20px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .card h2 {
      margin-top: 0;
      font-size: 18px;
      border-bottom: 2px solid var(--bg);
      padding-bottom: 10px;
    }
    .form-group {
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    select, input, button {
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-size: 14px;
    }
    button {
      background: var(--primary);
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover {
      background: var(--primary-hover);
    }
    button.btn-danger {
      background: var(--danger);
    }
    .doc-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .doc-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 10px;
      background: #fafafa;
    }
    .doc-info {
      display: flex;
      flex-direction: column;
    }
    .doc-meta {
      font-size: 11px;
      color: #64748b;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: bold;
      text-transform: uppercase;
    }
    .badge-user { background: #dbeafe; color: #1e40af; }
    .badge-staff { background: #dcfce7; color: #166534; }
  </style>
</head>
<body>

<div class="container">
  <!-- Auth Screen -->
  <div id="authContainer" class="auth-box">
    <div class="auth-tabs">
      <div id="tabLogin" class="auth-tab active" onclick="toggleAuthTab('login')">Login</div>
      <div id="tabRegister" class="auth-tab" onclick="toggleAuthTab('register')">Register</div>
    </div>

    <!-- Login Form -->
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="loginEmail">Email Address</label>
        <input type="email" id="loginEmail" required placeholder="user@example.com" />
      </div>
      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" required placeholder="••••••••" />
      </div>
      <button type="submit" style="width: 100%;">Sign In</button>
    </form>

    <!-- Register Form (Purely for Regular Users) -->
    <form id="registerForm" onsubmit="handleRegister(event)" style="display: none;">
      <div class="form-group">
        <label for="regName">Full Name</label>
        <input type="text" id="regName" required placeholder="John Doe" />
      </div>
      <div class="form-group">
        <label for="regEmail">Email Address</label>
        <input type="email" id="regEmail" required placeholder="user@example.com" />
      </div>
      <div class="form-group">
        <label for="regPassword">Password</label>
        <input type="password" id="regPassword" required placeholder="••••••••" />
      </div>
      <button type="submit" style="width: 100%;">Create Account</button>
    </form>
  </div>

  <!-- Dashboard Screen -->
  <div id="portalContainer" style="display: none;">
    <header>
      <div>
        <h1 style="margin:0; font-size:20px;">Document Portal</h1>
        <small id="userGreeting" style="color:#64748b;"></small>
      </div>
      <button class="btn-danger" onclick="handleLogout()">Logout</button>
    </header>

    <div class="grid">
      <!-- Send File Panel -->
      <div class="card">
        <h2 id="formTitle">Send File</h2>
        <form id="uploadForm" onsubmit="handleSendDocument(event)">
          <div class="form-group" id="recipientGroup" style="display:none;">
            <label for="recipientUser">Target User Email:</label>
            <select id="recipientUser">
              <!-- Dynamically populated with registered users -->
            </select>
          </div>

          <div class="form-group">
            <label for="docName">Document Title / Note:</label>
            <input type="text" id="docName" placeholder="e.g. Resume / Review Feedback" required />
          </div>

          <div class="form-group">
            <label for="fileInput">Choose File:</label>
            <input type="file" id="fileInput" required />
          </div>

          <button type="submit" style="width: 100%;">Upload & Send</button>
        </form>
      </div>

      <!-- Inbox / Dashboard Panel -->
      <div class="card">
        <h2 id="dashboardTitle">Your Documents</h2>
        <ul id="documentList" class="doc-list">
          <!-- Documents loaded dynamically -->
        </ul>
      </div>
    </div>
  </div>
</div>

<script>
  // Hardcoded Staff Account Credentials
  const STAFF_ACCOUNT = {
    email: "mohamed.nyakagwa@gmail.com",
    password: "Nyakagwa@6450",
    name: "Staff Moderator",
    role: "staff"
  };

  // App State Helpers
  function getUsers() {
    return JSON.parse(localStorage.getItem('portal_users')) || [];
  }

  function saveUsers(users) {
    localStorage.setItem('portal_users', JSON.stringify(users));
  }

  function getCurrentUser() {
    return JSON.parse(localStorage.getItem('portal_active_session'));
  }

  function setCurrentUser(user) {
    localStorage.setItem('portal_active_session', JSON.stringify(user));
  }

  function getDocuments() {
    return JSON.parse(localStorage.getItem('portal_documents')) || [];
  }

  function saveDocuments(docs) {
    localStorage.setItem('portal_documents', JSON.stringify(docs));
  }

  // Auth UI Switcher
  function toggleAuthTab(tab) {
    const isLogin = tab === 'login';
    document.getElementById('tabLogin').className = isLogin ? 'auth-tab active' : 'auth-tab';
    document.getElementById('tabRegister').className = !isLogin ? 'auth-tab active' : 'auth-tab';
    document.getElementById('loginForm').style.display = isLogin ? 'block' : 'none';
    document.getElementById('registerForm').style.display = !isLogin ? 'block' : 'none';
  }

  // Registration Handler (Always assigns 'user' role)
  function handleRegister(e) {
    e.preventDefault();
    const name = document.getElementById('regName').value;
    const email = document.getElementById('regEmail').value.toLowerCase().trim();
    const password = document.getElementById('regPassword').value;

    if (email === STAFF_ACCOUNT.email.toLowerCase()) {
      alert('This email address is reserved for staff login.');
      return;
    }

    const users = getUsers();
    if (users.find(u => u.email === email)) {
      alert('An account with this email address already exists.');
      return;
    }

    const newUser = { name, email, password, role: 'user' };
    users.push(newUser);
    saveUsers(users);

    setCurrentUser(newUser);
    initDashboard();
  }

  // Login Handler (Verifies Staff or Regular User)
  function handleLogin(e) {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value.toLowerCase().trim();
    const password = document.getElementById('loginPassword').value;

    // 1. Check Staff Login
    if (email === STAFF_ACCOUNT.email.toLowerCase() && password === STAFF_ACCOUNT.password) {
      setCurrentUser(STAFF_ACCOUNT);
      initDashboard();
      return;
    }

    // 2. Check User Accounts
    const users = getUsers();
    const foundUser = users.find(u => u.email === email && u.password === password);

    if (!foundUser) {
      alert('Invalid email or password.');
      return;
    }

    setCurrentUser(foundUser);
    initDashboard();
  }

  function handleLogout() {
    localStorage.removeItem('portal_active_session');
    document.getElementById('portalContainer').style.display = 'none';
    document.getElementById('authContainer').style.display = 'block';
    document.getElementById('loginForm').reset();
    document.getElementById('registerForm').reset();
  }

  // Dashboard Initialization
  function initDashboard() {
    const user = getCurrentUser();
    if (!user) return;

    document.getElementById('authContainer').style.display = 'none';
    document.getElementById('portalContainer').style.display = 'block';

    document.getElementById('userGreeting').textContent = `${user.name} (${user.role.toUpperCase()}) - ${user.email}`;

    const formTitle = document.getElementById('formTitle');
    const recipientGroup = document.getElementById('recipientGroup');
    const dashboardTitle = document.getElementById('dashboardTitle');

    if (user.role === 'staff') {
      formTitle.textContent = 'Send Document to User';
      recipientGroup.style.display = 'flex';
      dashboardTitle.textContent = 'Staff Portal - All User Documents';
      populateRecipientDropdown();
    } else {
      formTitle.textContent = 'Send File to Staff';
      recipientGroup.style.display = 'none';
      dashboardTitle.textContent = 'Your Dashboard - Received & Sent Files';
    }

    renderDocuments();
  }

  function populateRecipientDropdown() {
    const users = getUsers().filter(u => u.role === 'user');
    const select = document.getElementById('recipientUser');
    select.innerHTML = '';

    if (users.length === 0) {
      select.innerHTML = '<option value="">No registered users found</option>';
      return;
    }

    users.forEach(u => {
      const opt = document.createElement('option');
      opt.value = u.email;
      opt.textContent = `${u.name} (${u.email})`;
      select.appendChild(opt);
    });
  }

  // Document Operations
  function handleSendDocument(e) {
    e.preventDefault();
    const user = getCurrentUser();
    const docName = document.getElementById('docName').value;
    const fileInput = document.getElementById('fileInput');

    if (!fileInput.files.length) return;

    const file = fileInput.files[0];
    const reader = new FileReader();

    reader.onload = function (event) {
      const docs = getDocuments();
      
      const recipient = user.role === 'staff' 
        ? document.getElementById('recipientUser').value 
        : STAFF_ACCOUNT.email;

      if (user.role === 'staff' && !recipient) {
        alert('Please select a recipient user.');
        return;
      }

      const newDoc = {
        id: Date.now(),
        senderRole: user.role,
        senderEmail: user.email,
        senderName: user.name,
        recipientEmail: recipient,
        fileName: docName + ' (' + file.name + ')',
        fileData: event.target.result,
        timestamp: new Date().toLocaleString()
      };

      docs.push(newDoc);
      saveDocuments(docs);

      document.getElementById('uploadForm').reset();
      renderDocuments();
    };

    reader.readAsDataURL(file);
  }

  function renderDocuments() {
    const user = getCurrentUser();
    const docs = getDocuments();
    const docList = document.getElementById('documentList');
    docList.innerHTML = '';

    const visibleDocs = docs.filter(doc => {
      if (user.role === 'staff') return true;
      return doc.recipientEmail === user.email || doc.senderEmail === user.email;
    });

    if (visibleDocs.length === 0) {
      docList.innerHTML = '<li style="color:#64748b; font-size:13px;">No documents found.</li>';
      return;
    }

    visibleDocs.reverse().forEach(doc => {
      const li = document.createElement('li');
      li.className = 'doc-item';

      const isStaffSender = doc.senderRole === 'staff';
      const badgeClass = isStaffSender ? 'badge-staff' : 'badge-user';
      const badgeText = isStaffSender ? 'From Staff' : 'From User';

      li.innerHTML = `
        <div class="doc-info">
          <strong>${doc.fileName}</strong>
          <span class="doc-meta">
            <span class="badge ${badgeClass}">${badgeText}</span>
            From: ${doc.senderName} (${doc.senderEmail}) → To: ${doc.recipientEmail}
          </span>
          <span class="doc-meta">${doc.timestamp}</span>
        </div>
        <a href="${doc.fileData}" download="${doc.fileName}" style="text-decoration:none;">
          <button type="button" style="padding:4px 8px; font-size:12px;">Download</button>
        </a>
      `;

      docList.appendChild(li);
    });
  }

  if (getCurrentUser()) {
    initDashboard();
  }
</script>

</body>
</html>
