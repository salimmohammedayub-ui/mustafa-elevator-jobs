<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document Portal | User & Staff Exchange</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --border: #e2e8f0;
      --success: #16a34a;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card);
      padding: 15px 20px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 20px;
    }
    .role-selector {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    select, input, button {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-size: 14px;
    }
    button {
      background: var(--primary);
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover {
      background: var(--primary-hover);
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media (max-width: 768px) {
      .grid { grid-template-columns: 1fr; }
    }
    .card {
      background: var(--card);
      padding: 20px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .card h2 {
      margin-top: 0;
      font-size: 18px;
      border-bottom: 2px solid var(--bg);
      padding-bottom: 10px;
    }
    .form-group {
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .doc-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .doc-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 10px;
      background: #fafafa;
    }
    .doc-info {
      display: flex;
      flex-direction: column;
    }
    .doc-meta {
      font-size: 11px;
      color: #64748b;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: bold;
      text-transform: uppercase;
    }
    .badge-user { background: #dbeafe; color: #1e40af; }
    .badge-staff { background: #dcfce7; color: #166534; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div>
      <h1 style="margin:0; font-size:20px;">Document Portal</h1>
      <small style="color:#64748b;">Send and Receive Documents</small>
    </div>
    <div class="role-selector">
      <label for="currentRole"><strong>Current View:</strong></label>
      <select id="currentRole" onchange="switchRole()">
        <option value="user">Registered User (John Doe)</option>
        <option value="staff">Staff / Moderator</option>
      </select>
    </div>
  </header>

  <div class="grid">
    <!-- Send File Panel -->
    <div class="card">
      <h2 id="formTitle">Send File to Staff</h2>
      <form id="uploadForm" onsubmit="handleSendDocument(event)">
        <div class="form-group" id="recipientGroup" style="display:none;">
          <label for="recipientUser">Select Target User:</label>
          <select id="recipientUser">
            <option value="John Doe">John Doe (User)</option>
            <option value="Jane Smith">Jane Smith (User)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="docName">Document Title / Note:</label>
          <input type="text" id="docName" placeholder="e.g. Updated CV / Review Request" required />
        </div>

        <div class="form-group">
          <label for="fileInput">Choose File:</label>
          <input type="file" id="fileInput" required />
        </div>

        <button type="submit" style="width: 100%;">Upload & Send</button>
      </form>
    </div>

    <!-- Inbox / Dashboard Panel -->
    <div class="card">
      <h2 id="dashboardTitle">Your Received Documents</h2>
      <ul id="documentList" class="doc-list">
        <!-- Documents loaded dynamically -->
      </ul>
    </div>
  </div>
</div>

<script>
  // Initial demo data stored in localStorage if not already present
  if (!localStorage.getItem('portal_documents')) {
    const initialDocs = [
      {
        id: 1,
        senderRole: 'staff',
        senderName: 'Staff Moderator',
        recipientUser: 'John Doe',
        fileName: 'Approved_Application.pdf',
        fileData: '#',
        timestamp: new Date().toLocaleString()
      }
    ];
    localStorage.setItem('portal_documents', JSON.stringify(initialDocs));
  }

  function getDocuments() {
    return JSON.parse(localStorage.getItem('portal_documents')) || [];
  }

  function saveDocuments(docs) {
    localStorage.setItem('portal_documents', JSON.stringify(docs));
  }

  function switchRole() {
    const role = document.getElementById('currentRole').value;
    const formTitle = document.getElementById('formTitle');
    const recipientGroup = document.getElementById('recipientGroup');
    const dashboardTitle = document.getElementById('dashboardTitle');

    if (role === 'staff') {
      formTitle.textContent = 'Send Document to User';
      recipientGroup.style.display = 'flex';
      dashboardTitle.textContent = 'Staff Portal - All User Submissions';
    } else {
      formTitle.textContent = 'Send File to Staff';
      recipientGroup.style.display = 'none';
      dashboardTitle.textContent = 'Your Dashboard - Received Files';
    }

    renderDocuments();
  }

  function handleSendDocument(e) {
    e.preventDefault();
    const role = document.getElementById('currentRole').value;
    const docName = document.getElementById('docName').value;
    const fileInput = document.getElementById('fileInput');

    if (!fileInput.files.length) return;

    const file = fileInput.files[0];
    const reader = new FileReader();

    reader.onload = function (event) {
      const docs = getDocuments();
      
      const newDoc = {
        id: Date.now(),
        senderRole: role,
        senderName: role === 'staff' ? 'Staff Moderator' : 'John Doe',
        recipientUser: role === 'staff' ? document.getElementById('recipientUser').value : 'John Doe',
        fileName: docName + ' (' + file.name + ')',
        fileData: event.target.result, // Base64 representation of file
        timestamp: new Date().toLocaleString()
      };

      docs.push(newDoc);
      saveDocuments(docs);

      // Reset form
      document.getElementById('uploadForm').reset();
      renderDocuments();
    };

    reader.readAsDataURL(file);
  }

  function renderDocuments() {
    const role = document.getElementById('currentRole').value;
    const docs = getDocuments();
    const docList = document.getElementById('documentList');
    docList.innerHTML = '';

    // Filter rules:
    // - User sees docs sent to them by staff, or docs they sent to staff
    // - Staff sees all documents sent across the system
    const visibleDocs = docs.filter(doc => {
      if (role === 'staff') return true;
      return doc.recipientUser === 'John Doe' || (doc.senderName === 'John Doe' && doc.senderRole === 'user');
    });

    if (visibleDocs.length === 0) {
      docList.innerHTML = '<li style="color:#64748b; font-size:13px;">No documents found.</li>';
      return;
    }

    visibleDocs.reverse().forEach(doc => {
      const li = document.createElement('li');
      li.className = 'doc-item';

      const isStaffSender = doc.senderRole === 'staff';
      const badgeClass = isStaffSender ? 'badge-staff' : 'badge-user';
      const badgeText = isStaffSender ? 'From Staff' : 'From User';

      li.innerHTML = `
        <div class="doc-info">
          <strong>${doc.fileName}</strong>
          <span class="doc-meta">
            <span class="badge ${badgeClass}">${badgeText}</span>
            Sender: ${doc.senderName} | Target: ${doc.recipientUser}
          </span>
          <span class="doc-meta">${doc.timestamp}</span>
        </div>
        <a href="${doc.fileData}" download="${doc.fileName}" style="text-decoration:none;">
          <button type="button" style="padding:4px 8px; font-size:12px;">Download</button>
        </a>
      `;

      docList.appendChild(li);
    });
  }

  // Initial render
  renderDocuments();
</script>

</body>
</html>
